<!DOCTYPE html>
<html>

    <head>
        <title>Login</title>
    </head>

    <body>

        <h1>Login Page</h1>

        <form action="/submit/" method="POST">

            <p>Email</p>
            <input
                type="email"
                name="email"
                required>

            <p>Password</p>
            <input
                type="password"
                name="password"
                required>

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

        <br>

        <a href="/">
            New User? Register
        </a>

    </body>

</html>
